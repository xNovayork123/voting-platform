{% extends "admin/change_list.html" %}
{% load i18n %}

{% block content %}
{% if export_shortcuts %}
<div style="
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 6px;
  padding: 16px 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
">
  <strong style="margin-right:8px; color:#333;">📤 Export current dataset:</strong>
  {% for shortcut in export_shortcuts %}
  <a
    href="{{ shortcut.url }}"
    style="
      display:inline-block;
      padding: 6px 14px;
      background: #0d6efd;
      color: #fff;
      border-radius: 4px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s;
    "
    onmouseover="this.style.background='#0b5ed7'"
    onmouseout="this.style.background='#0d6efd'"
  >{{ shortcut.label }}</a>
  {% endfor %}
</div>
{% endif %}

{{ block.super }}
{% endblock %}
